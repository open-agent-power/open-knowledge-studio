<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OKS</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/studio.css" />
    <link rel="stylesheet" href="/studio/graph.css" />
    <link rel="stylesheet" href="/studio/goals.css" />
    <link rel="stylesheet" href="/studio/learning.css" />
    <link rel="stylesheet" href="/studio/evaluation.css" />
    <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
    <script src="/vendor/katex/katex.min.js" defer></script>
    <script src="/graph-labels.js" defer></script>
    <script src="/force-layout.js" defer></script>
    <script src="/studio-model.js" defer></script>
    <script src="/workspace-ui.js" defer></script>
    <script type="module" src="/studio.js"></script>
    <link rel="stylesheet" href="/studio-theme.css" />
  </head>
  <body>
    <a class="skip" href="#content">跳到内容</a>
    <header class="studio-header">
      <a class="brand" href="/">oks.</a>
      <nav aria-label="主导航">
        <button data-tab="discuss" aria-current="page">讨论</button
        ><button data-tab="goals">目标</button
        ><button data-tab="learning">学习</button>
      </nav>
      <button id="instance" aria-label="知识库配置"></button
      ><button id="showGuide" aria-label="使用引导">?</button>
    </header>
    <aside id="onboarding" hidden></aside>
    <main>
      <div id="scopeBar">
        <label for="scope">日期</label
        ><button id="previousDay" type="button" aria-label="上一天" title="上一天">‹</button><input id="scope" type="date" aria-label="日期" /><button id="nextDay" type="button" aria-label="下一天" title="下一天">›</button><button
          id="newGoal"
          title="新增目标 Markdown"
          aria-label="新增目标 Markdown"
        >
          ＋</button
        ><span id="status" role="status" aria-live="polite"></span>
      </div>
      <section id="content" tabindex="-1"></section>
    </main>
    <dialog id="libraryDialog" aria-labelledby="libraryTitle">
      <header>
        <span id="libraryTitle">知识库</span
        ><button id="closeLibraries" aria-label="关闭知识库配置">×</button>
      </header>
      <label for="personalLibrary">个人知识库</label>
      <div class="library-personal">
        <span id="personalLibraryName" class="library-folder"></span>
        <input
          id="personalLibrary"
          spellcheck="false"
          autocomplete="off"
        /><button id="choosePersonalLibrary" type="button">选择文件夹</button><button id="switchLibrary" type="button">切换</button>
      </div>
      <div class="library-heading">
        <span>团队知识库</span
        ><button id="addTeamLibrary" type="button" aria-label="添加团队知识库">
          ＋
        </button>
      </div>
      <div id="teamLibraries"></div>
      <p id="libraryError" role="alert"></p>
      <footer>
        <button id="saveTeamLibraries" type="button">保存</button>
      </footer>
    </dialog>
    <dialog id="fileDialog">
      <header>
        <span id="fileTitle"></span
        ><button id="closeFile" aria-label="关闭文件">×</button>
      </header>
      <pre id="fileText"></pre>
    </dialog>
    <dialog id="newDialog">
      <form id="newForm">
        <header>
          新增文档<button type="button" id="closeNew" aria-label="关闭">
            ×
          </button>
        </header>
        <label for="newPath">标题</label
        ><input
          id="newPath"
          required
          placeholder="新目标"
          maxlength="300"
        /><label for="newText">Markdown</label
        ><textarea id="newText" required rows="9"></textarea>
        <p id="newError" role="alert"></p>
        <button type="submit">创建</button>
      </form>
    </dialog>
  </body>
</html>
