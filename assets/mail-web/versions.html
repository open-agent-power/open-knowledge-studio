<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>技能版本 · OKS</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/tasks.css"><link rel="stylesheet" href="/versions.css"><script src="/workspace-ui.js" defer></script><script src="/versions.js" defer></script></head>
<body>
<header class="topbar"><a class="brand" href="/" aria-label="OKS 工作区">oks<span>.</span></a><nav aria-label="主导航"><a href="/#collaboration">讨论</a><a href="/tasks">目标</a><a href="/#wiki">学习</a></nav><details class="more-nav"><summary>更多</summary><div class="more-nav-menu"><a href="/#messages">通信记录</a><a href="/#agents">成员</a><a href="/start">接入检查</a><a href="/review">学习审核</a><a href="/debug">诊断</a><span aria-current="page">技能版本</span></div></details><button id="refresh" class="quiet" type="button">刷新</button></header>
<main>
<header class="intro"><p class="eyebrow">技能版本</p><h1>技能版本</h1><p>查看两个版本的变化，以及哪些任务仍在使用旧版。</p></header>
<section class="picker"><label for="skillId">技能名称</label><input id="skillId" maxlength="64" autocomplete="off" placeholder="例如：query"><button id="loadVersions" type="button">查找版本</button><span id="status" role="status" aria-live="polite">输入技能名称后查找。</span></section>
<section id="compareControls" class="compare-controls" hidden><label>版本一<select id="fromVersion"></select></label><label>版本二<select id="toVersion"></select></label><button id="compare" type="button">比较变化</button></section>
<section id="versionList" class="version-list"></section>
<section class="bundled-section"><div class="create-heading"><h2>随程序提供的技能说明</h2><button id="compareBundled" type="button">与所选版本比较</button></div><p class="note">这里只比较说明文字。准备审核建议不会替换现有知识，也不会安装或运行技能。</p><p id="bundledStatus" role="status" aria-live="polite"></p><div id="bundledResult" hidden><pre id="bundledDiff" class="diff-text"></pre><details><summary>查看文件清单</summary><div id="bundledFiles"></div></details><button id="prepareBundled" type="button" disabled>准备审核建议</button><p id="bundledGate" class="note"></p><details id="bundledEditDetails" hidden><summary>查看本地编辑启动命令</summary><code id="bundledEditCommand"></code></details><div id="bundledNext"></div></div></section>
<div id="results" hidden>
<section class="summary-grid"><article><h2>版本一</h2><p id="fromSummary"></p></article><article><h2>版本二</h2><p id="toSummary"></p></article></section>
<section class="changes-section"><h2>文件差异 <span id="changeCount"></span></h2><div id="changes"></div></section>
<section class="impact-section"><h2>仍引用版本一的任务</h2><div id="tasks"></div><p class="note">这里显示的是版本关联记录，不表示任务正在运行。使用情况由记录方填写，未验证是否执行。</p></section>
<section class="recovery-section"><h2>使用技能版本</h2><p class="note">只有审核通过的版本可以加载。若本地文件有改动或不是由 OKS 管理，会保留原样。</p><details><summary>查看加载步骤与技术信息</summary><p id="loadCommand"></p><div id="hostStates"></div></details></section>
</div>
</main>
</body></html>
