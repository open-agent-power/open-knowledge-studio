<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1370" role="img" aria-labelledby="title desc">
  <title id="title">Agent-Native Ingest 泳道图</title>
  <desc id="desc">Human、CLI、Agent 和 Provider 四个泳道展示从提供源到 Raw Bundle、Candidate 和人工审查的完整时序。</desc>
  <defs>
    <marker id="arrow-swim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
    <filter id="shadow-swim" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#263238" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="1370" fill="#ffffff"/>
  <text x="600" y="30" text-anchor="middle" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#263238">Agent-Native Ingest：从 Source 到 Wiki</text>

  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <rect x="20" y="60" width="270" height="1250" rx="8" fill="#fff8f2" stroke="#ffccbc"/>
    <rect x="310" y="60" width="270" height="1250" rx="8" fill="#f7f9fa" stroke="#cfd8dc"/>
    <rect x="600" y="60" width="270" height="1250" rx="8" fill="#f5f9ff" stroke="#bbdefb"/>
    <rect x="890" y="60" width="290" height="1250" rx="8" fill="#f8faf8" stroke="#c8e6c9"/>

    <rect x="20" y="60" width="270" height="48" rx="8" fill="#ff8a65"/>
    <rect x="310" y="60" width="270" height="48" rx="8" fill="#78909c"/>
    <rect x="600" y="60" width="270" height="48" rx="8" fill="#42a5f5"/>
    <rect x="890" y="60" width="290" height="48" rx="8" fill="#66bb6a"/>
    <text x="155" y="91" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Human</text>
    <text x="445" y="91" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">CLI (oks)</text>
    <text x="735" y="91" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Agent</text>
    <text x="1035" y="91" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Provider</text>

    <g filter="url(#shadow-swim)">
      <rect x="45" y="145" width="220" height="58" rx="7" fill="#fff3e0" stroke="#ff8a65" stroke-width="1.5"/>
      <text x="155" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#5d4037">提供 URL 或文件</text>
      <text x="155" y="190" text-anchor="middle" font-size="12" fill="#795548">Source</text>

      <rect x="335" y="145" width="220" height="58" rx="7" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/>
      <text x="445" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#37474f">oks ingest prepare</text>
      <text x="445" y="190" text-anchor="middle" font-size="12" fill="#546e7a">workspace + recipe + candidates</text>

      <rect x="335" y="235" width="220" height="58" rx="7" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/>
      <text x="445" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#37474f">协议骨架已预填</text>
      <text x="445" y="280" text-anchor="middle" font-size="12" fill="#546e7a">source-envelope + manifest</text>

      <rect x="625" y="145" width="220" height="58" rx="7" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5"/>
      <text x="735" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#1565c0">读 Recipe + candidates</text>
      <text x="735" y="190" text-anchor="middle" font-size="12" fill="#1976d2">理解 required capabilities</text>

      <polygon points="445,330 500,375 445,420 390,375" fill="#fff8e1" stroke="#f9a825" stroke-width="1.8"/>
      <text x="445" y="371" text-anchor="middle" font-size="13" font-weight="700" fill="#5d4037">text_ready?</text>

      <rect x="335" y="455" width="220" height="62" rx="7" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
      <text x="445" y="480" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">oks raw-commit</text>
      <text x="445" y="500" text-anchor="middle" font-size="12" fill="#558b2f">快速路径：跳过 Provider</text>

      <rect x="625" y="245" width="220" height="58" rx="7" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5"/>
      <text x="735" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#1565c0">选 Provider</text>
      <text x="735" y="290" text-anchor="middle" font-size="12" fill="#1976d2">按 Recipe 与 policy 选择</text>

      <rect x="625" y="345" width="220" height="58" rx="7" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5"/>
      <text x="735" y="370" text-anchor="middle" font-size="14" font-weight="700" fill="#1565c0">执行 Provider 调用</text>
      <text x="735" y="390" text-anchor="middle" font-size="12" fill="#1976d2">跨到 Provider 泳道</text>

      <rect x="925" y="345" width="220" height="58" rx="7" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
      <text x="1035" y="370" text-anchor="middle" font-size="14" font-weight="700" fill="#2e7d32">返回原始响应</text>
      <text x="1035" y="390" text-anchor="middle" font-size="12" fill="#558b2f">Provider 原文</text>

      <rect x="625" y="445" width="220" height="58" rx="7" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5"/>
      <text x="735" y="470" text-anchor="middle" font-size="14" font-weight="700" fill="#1565c0">保存原始输出</text>
      <text x="735" y="490" text-anchor="middle" font-size="12" fill="#1976d2">work/&lt;provider&gt;/</text>

      <rect x="625" y="545" width="220" height="72" rx="7" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5"/>
      <text x="735" y="570" text-anchor="middle" font-size="13" font-weight="700" fill="#1565c0">填 evidence-manifest.json</text>
      <text x="735" y="590" text-anchor="middle" font-size="12" fill="#1976d2">text · confidence ·</text>
      <text x="735" y="607" text-anchor="middle" font-size="12" fill="#1976d2">agent_judgment</text>

      <rect x="335" y="675" width="220" height="65" rx="7" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/>
      <text x="445" y="701" text-anchor="middle" font-size="13" font-weight="700" fill="#37474f">oks raw-commit</text>
      <text x="445" y="721" text-anchor="middle" font-size="12" fill="#546e7a">机械验证 provenance</text>

      <rect x="335" y="800" width="220" height="62" rx="7" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/>
      <text x="445" y="826" text-anchor="middle" font-size="14" font-weight="700" fill="#37474f">Raw Bundle v0.2</text>
      <text x="445" y="846" text-anchor="middle" font-size="12" fill="#546e7a">组装产物</text>

      <rect x="625" y="800" width="220" height="62" rx="7" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5"/>
      <text x="735" y="826" text-anchor="middle" font-size="14" font-weight="700" fill="#1565c0">读 evidence.jsonl</text>
      <text x="735" y="846" text-anchor="middle" font-size="12" fill="#1976d2">生成 Candidate</text>

      <rect x="625" y="925" width="220" height="62" rx="7" fill="#fff8e1" stroke="#ffc107" stroke-width="1.5"/>
      <text x="735" y="951" text-anchor="middle" font-size="14" font-weight="700" fill="#5d4037">写 drafts/&lt;slug&gt;.md</text>
      <text x="735" y="971" text-anchor="middle" font-size="12" fill="#795548">Candidate 中间态</text>

      <rect x="45" y="1055" width="220" height="58" rx="7" fill="#fff3e0" stroke="#ff8a65" stroke-width="1.5"/>
      <text x="155" y="1080" text-anchor="middle" font-size="14" font-weight="700" fill="#5d4037">审查 Candidate</text>
      <text x="155" y="1100" text-anchor="middle" font-size="12" fill="#795548">Human judgment</text>

      <rect x="335" y="1055" width="220" height="58" rx="7" fill="#fff3e0" stroke="#ff8a65" stroke-width="1.5"/>
      <text x="445" y="1080" text-anchor="middle" font-size="14" font-weight="700" fill="#5d4037">oks drafts promote</text>
      <text x="445" y="1100" text-anchor="middle" font-size="12" fill="#795548">→ wiki/</text>

      <rect x="625" y="1055" width="220" height="58" rx="7" fill="#fff3e0" stroke="#ff8a65" stroke-width="1.5"/>
      <text x="735" y="1080" text-anchor="middle" font-size="14" font-weight="700" fill="#5d4037">oks search 验证召回</text>
      <text x="735" y="1100" text-anchor="middle" font-size="12" fill="#795548">结果注入 Agent 上下文</text>
    </g>

    <g fill="none" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow-swim)">
      <path d="M265 174 H335"/>
      <path d="M445 203 V235"/>
      <path d="M555 174 H625"/>
      <path d="M445 293 V330"/>
      <path d="M500 375 H625 V274"/>
      <path d="M390 375 H300 V486 H335"/>
      <path d="M735 203 V245"/>
      <path d="M735 303 V345"/>
      <path d="M845 374 H925"/>
      <path d="M925 404 H845 V474"/>
      <path d="M735 503 V545"/>
      <path d="M625 581 H580 V707 H555"/>
      <path d="M445 740 V800"/>
      <path d="M555 831 H625"/>
      <path d="M735 862 V925"/>
      <path d="M445 517 V800" stroke-dasharray="7 5"/>
      <path d="M735 987 V1030 H155 V1055"/>
      <path d="M265 1084 H335"/>
      <path d="M555 1084 H625"/>
    </g>
    <g font-size="12" font-weight="700" fill="#607d8b">
      <text x="508" y="365">false</text>
      <text x="310" y="365">true</text>
      <text x="458" y="654">回到 CLI</text>
      <text x="465" y="786">汇合</text>
    </g>
    <rect x="910" y="455" width="250" height="128" rx="8" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
    <text x="1035" y="480" text-anchor="middle" font-size="13" font-weight="700" fill="#e65100">边界规则</text>
    <text x="930" y="507" font-size="12" fill="#6d4c41">Provider 原始响应必须</text>
    <text x="930" y="527" font-size="12" fill="#6d4c41">保存到 work/&lt;provider&gt;/；</text>
    <text x="930" y="547" font-size="12" fill="#6d4c41">缺失或为空 →</text>
    <text x="930" y="567" font-size="12" font-weight="700" fill="#c62828">PROVENANCE_UNVERIFIABLE</text>
  </g>
</svg>
