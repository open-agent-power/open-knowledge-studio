<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">OKS 摄入协议对象 ER 图</title>
  <desc id="desc">SourceEnvelope、EvidenceFragment、EvidenceManifest 与 Raw Bundle v0.2 的字段、引用关系和 provenance 规则。</desc>
  <defs>
    <marker id="arrow-er" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
    <filter id="shadow-er" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#263238" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1280" height="820" fill="#ffffff"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="640" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#263238">Agent-Native Ingest 协议对象关系</text>

    <g filter="url(#shadow-er)">
      <rect x="20" y="85" width="270" height="330" rx="8" fill="#fff8f2" stroke="#ff8a65" stroke-width="1.5"/>
      <rect x="20" y="85" width="270" height="62" rx="8" fill="#ff8a65"/>
      <text x="155" y="113" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">SourceEnvelope</text>
      <text x="155" y="135" text-anchor="middle" font-size="12" fill="#fff3e0">CLI 预填充，Agent 不碰</text>
      <text x="40" y="180" font-size="13" fill="#5d4037">source_id</text>
      <text x="40" y="207" font-size="13" fill="#5d4037">source_uri</text>
      <text x="40" y="234" font-size="13" fill="#5d4037">source_modality</text>
      <text x="40" y="261" font-size="13" fill="#5d4037">access_mode</text>
      <text x="40" y="288" font-size="13" fill="#5d4037">content_hash</text>
      <text x="40" y="315" font-size="13" fill="#5d4037">policy</text>
      <line x1="40" y1="338" x2="270" y2="338" stroke="#ffccbc"/>
      <text x="40" y="365" font-size="12" fill="#795548">描述源是什么</text>
      <text x="40" y="389" font-size="12" fill="#795548">1 个 Source → 1 个 Envelope</text>

      <rect x="320" y="60" width="370" height="460" rx="8" fill="#f5f9ff" stroke="#42a5f5" stroke-width="1.5"/>
      <rect x="320" y="60" width="370" height="62" rx="8" fill="#42a5f5"/>
      <text x="505" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">EvidenceFragment</text>
      <text x="505" y="110" text-anchor="middle" font-size="12" fill="#e3f2fd">每执行一个 Provider 产生一个 Fragment</text>
      <text x="340" y="155" font-size="13" fill="#1565c0">fragment_id</text>
      <text x="340" y="181" font-size="13" fill="#1565c0">source_id (FK)</text>
      <text x="340" y="207" font-size="13" fill="#1565c0">status</text>
      <text x="340" y="233" font-size="13" fill="#1565c0">artifacts[]</text>
      <text x="340" y="259" font-size="13" fill="#1565c0">evidence[]</text>
      <rect x="340" y="282" width="330" height="112" rx="6" fill="#e3f2fd" stroke="#90caf9"/>
      <text x="355" y="306" font-size="13" font-weight="700" fill="#1565c0">producer { }</text>
      <text x="375" y="332" font-size="12" fill="#1976d2">runtime</text>
      <text x="375" y="355" font-size="12" fill="#1976d2">provider</text>
      <text x="375" y="378" font-size="12" fill="#1976d2">tool</text>
      <line x1="340" y1="420" x2="670" y2="420" stroke="#90caf9"/>
      <text x="340" y="447" font-size="12" fill="#1976d2">一个 Provider 执行 = 一个 Fragment</text>
      <text x="340" y="473" font-size="12" fill="#1976d2">Fragment 保存证据与产物引用</text>

      <rect x="730" y="85" width="320" height="365" rx="8" fill="#f8f5ff" stroke="#9575cd" stroke-width="1.5"/>
      <rect x="730" y="85" width="320" height="62" rx="8" fill="#9575cd"/>
      <text x="890" y="113" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">EvidenceManifest</text>
      <text x="890" y="135" text-anchor="middle" font-size="12" fill="#ede7f6">Agent 汇总所有 Fragment 后提交</text>
      <text x="750" y="180" font-size="13" fill="#512da8">manifest_id</text>
      <text x="750" y="207" font-size="13" fill="#512da8">source_id (FK)</text>
      <text x="750" y="234" font-size="13" fill="#512da8">fragment_refs[]</text>
      <text x="750" y="261" font-size="13" fill="#512da8">evidence_records[]</text>
      <text x="750" y="288" font-size="13" fill="#512da8">steps[]</text>
      <text x="750" y="315" font-size="13" fill="#512da8">modalities{}</text>
      <text x="750" y="342" font-size="13" fill="#512da8">status</text>
      <line x1="750" y1="365" x2="1030" y2="365" stroke="#d1c4e9"/>
      <text x="750" y="392" font-size="12" fill="#673ab7">1 个源 → 1 个 Manifest</text>
      <text x="750" y="416" font-size="12" fill="#673ab7">引用 N 个 Fragment</text>

      <rect x="1090" y="120" width="170" height="300" rx="8" fill="#f5faf5" stroke="#66bb6a" stroke-width="1.5"/>
      <rect x="1090" y="120" width="170" height="62" rx="8" fill="#66bb6a"/>
      <text x="1175" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Raw Bundle</text>
      <text x="1175" y="166" text-anchor="middle" font-size="12" fill="#e8f5e9">v0.2</text>
      <text x="1110" y="215" font-size="12" fill="#2e7d32">bundle.json</text>
      <text x="1110" y="244" font-size="12" fill="#2e7d32">source-envelope.json</text>
      <text x="1110" y="273" font-size="12" fill="#2e7d32">evidence.jsonl</text>
      <text x="1110" y="302" font-size="12" fill="#2e7d32">content.md</text>
      <line x1="1110" y1="326" x2="1240" y2="326" stroke="#c8e6c9"/>
      <text x="1110" y="353" font-size="12" fill="#558b2f">1:1 from Manifest</text>
      <text x="1110" y="378" font-size="12" fill="#558b2f">oks raw-commit 组装</text>
    </g>

    <g fill="none" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow-er)">
      <path d="M290 250 H320"/>
      <path d="M690 290 H730"/>
      <path d="M1050 268 H1090"/>
    </g>
    <g font-size="12" font-weight="700" fill="#607d8b">
      <text x="295" y="238">1:N</text>
      <text x="695" y="278">N:1</text>
      <text x="1054" y="256">1:1</text>
    </g>

    <rect x="250" y="575" width="780" height="170" rx="8" fill="#fffdf5" stroke="#f9a825" stroke-width="1.5"/>
    <text x="275" y="607" font-size="15" font-weight="700" fill="#e65100">字段与 provenance 规则</text>
    <text x="275" y="638" font-size="13" fill="#6d4c41">producer.provider 取值：firecrawl / agent-runtime / runtime-tool / ...</text>
    <text x="275" y="668" font-size="13" fill="#6d4c41">agent_judgment 取值：mechanical / agent_observed / human_supplied</text>
    <text x="275" y="698" font-size="13" fill="#6d4c41">规则：mechanical + firecrawl = Provider 原文；agent_observed = Agent 改写过。</text>
    <text x="275" y="728" font-size="13" font-weight="700" fill="#c62828">raw-commit 会机械检查 work/&lt;provider&gt;/ 的原始文件存在且非空。</text>
  </g>
</svg>
