<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1320" role="img" aria-labelledby="title desc">
  <title id="title">OKS 核心管线快速路径与 Protocol 路径</title>
  <desc id="desc">从用户提供 Source 开始，按本地文本与其他 modality 分叉，最后汇合到 drafts、人工审查、wiki 和召回。</desc>
  <defs>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
    <filter id="shadow-flow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#263238" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="1320" fill="#ffffff"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="600" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#263238">OKS 核心管线：快速路径 vs Protocol 路径</text>

    <g filter="url(#shadow-flow)">
      <rect x="445" y="60" width="310" height="58" rx="8" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/>
      <text x="600" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#37474f">用户提供 Source</text>
      <text x="600" y="106" text-anchor="middle" font-size="12" fill="#546e7a">URL、文件或其他 modality</text>
      <polygon points="600,145 700,215 600,285 500,215" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
      <text x="600" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#5d4037">source 是本地</text>
      <text x="600" y="231" text-anchor="middle" font-size="14" font-weight="700" fill="#5d4037">.md / .txt？</text>

      <rect x="85" y="330" width="400" height="58" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
      <text x="285" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#2e7d32">oks ingest prepare</text>
      <text x="285" y="376" text-anchor="middle" font-size="12" fill="#558b2f">text_ready=true</text>
      <rect x="85" y="430" width="400" height="58" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
      <text x="285" y="456" text-anchor="middle" font-size="14" font-weight="700" fill="#2e7d32">所有协议文件预填充完成</text>
      <text x="285" y="476" text-anchor="middle" font-size="12" fill="#558b2f">无需 Provider 执行</text>
      <rect x="85" y="530" width="400" height="58" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
      <text x="285" y="556" text-anchor="middle" font-size="14" font-weight="700" fill="#2e7d32">oks raw-commit</text>
      <text x="285" y="576" text-anchor="middle" font-size="12" fill="#558b2f">一条命令直通</text>
      <rect x="85" y="630" width="400" height="58" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
      <text x="285" y="656" text-anchor="middle" font-size="14" font-weight="700" fill="#2e7d32">Raw Bundle v0.2</text>
      <text x="285" y="676" text-anchor="middle" font-size="12" fill="#558b2f">快速路径产物</text>
      <rect x="85" y="730" width="400" height="58" rx="8" fill="#fff8e1" stroke="#ffc107" stroke-width="1.5"/>
      <text x="285" y="756" text-anchor="middle" font-size="14" font-weight="700" fill="#5d4037">Agent 手写 Candidate → drafts/</text>
      <text x="285" y="776" text-anchor="middle" font-size="12" fill="#795548">与 Protocol 路径在 drafts 汇合</text>

      <rect x="715" y="330" width="400" height="58" rx="8" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5"/>
      <text x="915" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#1565c0">oks ingest prepare</text>
      <text x="915" y="376" text-anchor="middle" font-size="12" fill="#1976d2">Recipe + candidate_providers + 协议骨架</text>
      <rect x="715" y="430" width="400" height="58" rx="8" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5"/>
      <text x="915" y="456" text-anchor="middle" font-size="14" font-weight="700" fill="#1565c0">Agent 选 Provider + 执行</text>
      <text x="915" y="476" text-anchor="middle" font-size="12" fill="#1976d2">按 Recipe 与 policy 决定</text>
      <rect x="715" y="530" width="400" height="58" rx="8" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5"/>
      <text x="915" y="556" text-anchor="middle" font-size="14" font-weight="700" fill="#1565c0">保存原始输出到 work/&lt;provider&gt;/</text>
      <text x="915" y="576" text-anchor="middle" font-size="12" fill="#1976d2">保留 Provider 原文</text>
      <rect x="715" y="630" width="400" height="58" rx="8" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5"/>
      <text x="915" y="656" text-anchor="middle" font-size="14" font-weight="700" fill="#1565c0">Agent 填 evidence</text>
      <text x="915" y="676" text-anchor="middle" font-size="12" fill="#1976d2">text / confidence / agent_judgment</text>
      <rect x="715" y="730" width="400" height="58" rx="8" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5"/>
      <text x="915" y="756" text-anchor="middle" font-size="14" font-weight="700" fill="#1565c0">oks raw-commit</text>
      <text x="915" y="776" text-anchor="middle" font-size="12" fill="#1976d2">含 provenance 机械检查</text>
      <rect x="715" y="830" width="400" height="58" rx="8" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5"/>
      <text x="915" y="856" text-anchor="middle" font-size="14" font-weight="700" fill="#1565c0">Raw Bundle v0.2</text>
      <text x="915" y="876" text-anchor="middle" font-size="12" fill="#1976d2">Protocol 路径产物</text>
      <rect x="715" y="930" width="400" height="58" rx="8" fill="#fff8e1" stroke="#ffc107" stroke-width="1.5"/>
      <text x="915" y="956" text-anchor="middle" font-size="14" font-weight="700" fill="#5d4037">Agent 读 evidence.jsonl → drafts/</text>
      <text x="915" y="976" text-anchor="middle" font-size="12" fill="#795548">生成 Candidate</text>

      <rect x="380" y="1035" width="440" height="58" rx="8" fill="#fff8e1" stroke="#ffc107" stroke-width="1.5"/>
      <text x="600" y="1061" text-anchor="middle" font-size="14" font-weight="700" fill="#5d4037">drafts/</text>
      <text x="600" y="1081" text-anchor="middle" font-size="12" fill="#795548">两条入料路径在此汇合</text>
      <rect x="380" y="1135" width="440" height="58" rx="8" fill="#fff3e0" stroke="#ff8a65" stroke-width="1.5"/>
      <text x="600" y="1161" text-anchor="middle" font-size="14" font-weight="700" fill="#5d4037">/promote 人工审查 → wiki/</text>
      <text x="600" y="1181" text-anchor="middle" font-size="12" fill="#795548">Human review 是知识进入 Wiki 的门</text>
      <rect x="380" y="1235" width="440" height="58" rx="8" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/>
      <text x="600" y="1261" text-anchor="middle" font-size="14" font-weight="700" fill="#37474f">oks search / /query 召回</text>
      <text x="600" y="1281" text-anchor="middle" font-size="12" fill="#546e7a">注入 Agent 上下文</text>
    </g>

    <g fill="none" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow-flow)">
      <path d="M600 118 V145"/>
      <path d="M500 215 H285 V330"/>
      <path d="M700 215 H915 V330"/>
      <path d="M285 388 V430"/>
      <path d="M285 488 V530"/>
      <path d="M285 588 V630"/>
      <path d="M285 688 V730"/>
      <path d="M915 388 V430"/>
      <path d="M915 488 V530"/>
      <path d="M915 588 V630"/>
      <path d="M915 688 V730"/>
      <path d="M915 788 V830"/>
      <path d="M915 888 V930"/>
      <path d="M285 788 V1010 H600 V1035"/>
      <path d="M915 988 V1010 H600 V1035"/>
      <path d="M600 1093 V1135"/>
      <path d="M600 1193 V1235"/>
    </g>
    <g font-size="13" font-weight="700" fill="#607d8b">
      <text x="305" y="207">是 → 快速路径</text>
      <text x="725" y="207">否 → Protocol 路径</text>
    </g>
    <rect x="735" y="1000" width="360" height="42" rx="7" fill="#ffebee" stroke="#ef9a9a"/>
    <text x="915" y="1026" text-anchor="middle" font-size="12" font-weight="700" fill="#c62828">PROVENANCE_UNVERIFIABLE：work/ 缺失或为空时拒绝</text>
  </g>
</svg>
