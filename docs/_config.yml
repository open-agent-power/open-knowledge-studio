remote_theme: just-the-docs/just-the-docs@v0.12.0
title: Open Knowledge Studio
description: 给 Agent 使用的文件化知识工作空间：保存来源、审核经验，在后续任务中查询与引用。
baseurl: "/open-knowledge-studio"
url: "https://open-agent-power.github.io"
lang: zh-CN
favicon_ico: "/assets/oks-mark.svg"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 3
  preview_words_after: 3
  rel_url: true
  button: false

heading_anchors: true
back_to_top: true
back_to_top_text: "回到顶部"

color_scheme: light

# Callout 提示框（just-the-docs v0.4.0+）
# 用法：在段落或引用块前加 {: .note } / {: .tip } / {: .warning } / {: .important } / {: .highlight }
callouts:
  note:
    title: 提示
    color: blue
  tip:
    title: 建议
    color: green
  warning:
    title: 注意
    color: red
  important:
    title: 重要
    color: purple
  highlight:
    color: yellow

# 顶部辅助链接
aux_links:
  "GitHub":
    - "https://github.com/open-agent-power/open-knowledge-studio"

# Everything under docs/ is a published page. Versioned acceptance evidence
# lives in the top-level `records/` directory, not here. Historical handoffs,
# plans, and research notes remain in Git history instead of accumulating in
# either directory.

# 所有页面默认套 just-the-docs 的 default layout（左侧导航 + 侧边栏）
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
      has_toc: false
  - scope:
      path: "assets"
    values:
      layout: null
