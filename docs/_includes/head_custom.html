<script type="module">
  async function renderOksDiagrams() {
    const blocks = document.querySelectorAll("pre > code.language-mermaid");
    if (!blocks.length) return;
    const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs");
    const nodes = Array.from(blocks, (block) => {
      const node = document.createElement("div");
      node.className = "mermaid oks-mermaid";
      node.textContent = block.textContent;
      block.parentElement.replaceWith(node);
      return node;
    });
    mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: "neutral" });
    await mermaid.run({ nodes });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", renderOksDiagrams, { once: true });
  } else {
    renderOksDiagrams();
  }
</script>
