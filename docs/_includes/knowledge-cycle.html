<ol class="oks-cycle" aria-label="从保存来源到在后续任务中查询和使用">
  <li><strong>Raw</strong><span>保存原文、出处和实际提取结果</span></li>
  <li><strong>Candidate</strong><span>Agent 整理可复用的提议并附上依据</span></li>
  <li class="oks-cycle-review"><strong>人工审核</strong><span>针对当前版本接受、拒绝或继续修改</span></li>
  <li><strong>Wiki</strong><span>通过审核的版本成为带审核记录的知识页</span></li>
  <li><strong>Recall</strong><span>返回可能相关的内容，由 Agent 判断是否适用</span></li>
</ol>
