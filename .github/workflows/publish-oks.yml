name: Publish oks to PyPI

# Trusted Publishing (OIDC) — no API token stored.
# Triggered by pushing a tag like v0.1.0. Builds the CLI package in cli/
# and uploads to pypi.org.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        # PyPI rejects re-uploads of an existing version, so a stale
        # pyproject version turns the release into a silent no-op.
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('cli/pyproject.toml','rb'))['project']['version'])")
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match cli/pyproject.toml version ${PKG_VERSION} — bump the version before tagging."
            exit 1
          fi

      - name: Run tests before publish
        # v0.6.10 教训: publish workflow 不跑测试 → broken 0.6.9 直接发 PyPI
        # (ruff auto-fix 误删 #46-#49 import, 7 测试 fail 但 CI 仍 publish).
        # 加此 gate: 测试 fail 则 build fail, broken 版本不会到 PyPI.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./cli
          python -m pip install pytest requests
          python -m pytest cli/tests/ -q

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run frontend contracts before publish
        run: node --test cli/tests/test_knowledge_heatmap.js cli/tests/test_studio_model.js cli/tests/test_studio_lifecycle.js cli/tests/test_workspace_navigation.js cli/tests/test_draft_review.js cli/tests/test_graph.js cli/tests/test_knowledge_view.js

      - name: Install build backend
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        working-directory: cli
        run: python -m build --outdir ../dist

      - name: Validate the distributions to publish
        run: python cli/scripts/check_dist.py dist

      - name: Exercise the distributions outside the checkout
        run: python cli/scripts/smoke_installed.py dist --work-dir "${{ runner.temp }}/oks-publish-installed"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
