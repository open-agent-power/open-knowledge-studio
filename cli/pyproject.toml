[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-knowledge-studio"
version = "0.4.0.dev0"
description = "File-based knowledge engineering CLI for Claude Code"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{ name = "open-agent-power" }]
keywords = ["knowledge-base", "memory", "cli", "claude", "agent", "recall"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "python-frontmatter>=1",
    "jieba>=0.42",
    "gitpython>=3",
    "pyyaml>=6",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
document = ["markitdown[docx,pptx]==0.1.6"]
pdf-lite = ["pymupdf4llm==0.0.27", "pymupdf==1.28.0"]
pdf = ["mineru[pipeline]==3.4.4", "six==1.17.0"]
watch = [
    "faster-whisper==1.2.1",
    "rapidocr==3.9.1",
    "onnxruntime==1.27.0",
    "scenedetect>=0.7,<0.8",
    "imagehash>=4.3,<5",
    "yt-dlp==2026.7.4",
    # watch-skill is intentionally absent: PyPI rejects any Requires-Dist with a
    # direct URL, so listing it here makes the whole release unpublishable.
    # `oks capability install watch` installs it at runtime (see cli._CAPABILITIES).
]
formula = [
    "paddlepaddle==3.2.0",
    "paddleocr==3.7.0",
    # Keep in sync with cli._CAPABILITIES: MinerU 3.4.4 allows
    # >=0.22.0,<=0.23.0, but 0.23.0 is not published for the supported index.
    "tokenizers==0.22.1",
    "ftfy==6.3.1",
]

[project.urls]
Homepage = "https://github.com/open-agent-power/open-knowledge-studio"
Repository = "https://github.com/open-agent-power/open-knowledge-studio"
Documentation = "https://open-agent-power.github.io/open-knowledge-studio/"

[project.scripts]
oks = "knowledge_studio.cli:app"

[tool.setuptools]
include-package-data = true
packages = [
    "knowledge_studio",
    "knowledge_studio.capabilities",
    "knowledge_studio.providers",
    "knowledge_studio.recipes",
    "knowledge_studio.schemas",
    "knowledge_studio.security",
    "knowledge_studio.skill_templates",
    "knowledge_studio.skill_templates.claude",
    "knowledge_studio.skill_templates.agents",
]

[tool.setuptools.package-dir]
"knowledge_studio" = "knowledge_studio"
"knowledge_studio.capabilities" = "knowledge_studio/capabilities"
"knowledge_studio.providers" = "knowledge_studio/providers"
"knowledge_studio.recipes" = "knowledge_studio/recipes"
"knowledge_studio.schemas" = "knowledge_studio/schemas"
"knowledge_studio.security" = "knowledge_studio/security"
"knowledge_studio.skill_templates" = "knowledge_studio/skill_templates"
"knowledge_studio.skill_templates.claude" = "knowledge_studio/skill_templates/claude"
"knowledge_studio.skill_templates.agents" = "knowledge_studio/skill_templates/agents"

[tool.setuptools.package-data]
knowledge_studio = [
    "_assets/**/*",
    "_assets/scripts/*.py",
]
"knowledge_studio.schemas" = ["*.schema.json", "*.md"]
"knowledge_studio.capabilities" = ["*.yaml"]
"knowledge_studio.providers" = ["*/provider.yaml", "*/SKILL.md", "*/normalize.py"]
"knowledge_studio.recipes" = ["*.md"]
"knowledge_studio.security" = ["*.py"]
"knowledge_studio.skill_templates.claude" = ["skills/*/SKILL.md", "skills/*/scripts/*.py"]
"knowledge_studio.skill_templates.agents" = ["skills/*/SKILL.md", "skills/*/scripts/*.py"]
